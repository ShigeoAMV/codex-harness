name: Harness CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify through the native shell wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -NoProfile -File ./harness.ps1 verify --project . --stage dev
          else
            bash harness.sh verify --project . --stage dev
          fi
      - name: Save development evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}
          path: .harness-evidence/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Lint and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned quality tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements-ci.txt
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          ruff --version
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/actionlint" -version
      - name: Check Python correctness and workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          ruff check --select E9,F63,F7,F82 harness.py checks.py tests
          "$RUNNER_TEMP/actionlint" -shellcheck=""
      - name: Prove secret detection blocks a synthetic credential
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d "$RUNNER_TEMP/gitleaks-canary.XXXXXX")
          trap 'rm -rf "$fixture"' EXIT
          python -c 'import hashlib; print("github_token = " + repr("ghp_" + hashlib.sha256(b"harness synthetic canary").hexdigest()[:36]))' > "$fixture/canary.txt"
          result=0
          "$RUNNER_TEMP/gitleaks" dir "$fixture" --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$fixture/report.json" || result=$?
          test "$result" -eq 1
          python -c 'import json, sys; assert any(r["RuleID"] == "github-pat" for r in json.load(open(sys.argv[1])))' "$fixture/report.json"
      - name: Scan checked-out Git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .harness-evidence
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --no-banner --exit-code 1 \
            --report-format json --report-path .harness-evidence/gitleaks.json
      - name: Save redacted secret scan report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gitleaks-report
          path: .harness-evidence/gitleaks.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
